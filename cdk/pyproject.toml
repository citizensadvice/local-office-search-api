[tool.poetry]
name = "corporate-webhooks"
version = "0.1.0"
description = "CDK app for the Local Office Search API project"
authors = ["Citizens Advice"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
ca-cdk-constructs = "^0.17.3"
ca-cdk8s-constructs = "^5.0.1"
ruff = "^0.15.8"
cdk8s-plus-32 = "^2.5.42"

[tool.ruff]
target-version = 'py312'
line-length = 95

[tool.ruff.lint]
select = ['E', 'W', 'F', 'C', 'N', 'INP']
ignore = ['E501']

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
