name: Stage Deployment
run-name: Deploy ${{ inputs.stage }}

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: Deploy infrastructure and chart
    runs-on: runs-on
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ inputs.stage }}
    concurrency:
      group: ${{ inputs.stage }}-cdk-deploy
    steps:
      - name: Sleep for 1 minute
        run: echo "Waiting for 60 seconds to allow for abort of prod deployment" && sleep 60
        shell: bash
        if: inputs.stage == 'prod'

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - uses: citizensadvice/python-poetry-setup-action@a1b420d0c061560845532d7d1f80a81c8f39b6a5
        with:
          install_cdk: true
          project_root: "./cdk"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: "arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/LocalOfficeSearchApiDeployment"
          role-session-name: local-office-search-api-deploy-${{ inputs.stage }}-workflow
          aws-region: eu-west-1

      - name: Deploy CDK
        run: |
          set -eo pipefail
          cd ./cdk
          poetry run cdk deploy "${{ inputs.stage }}/**" --concurrency 2 --require-approval never

  slack-success:
    name: Slack Notification (Success)
    runs-on: runs-on
    needs:
      - deploy
    steps:
      - name: Notify Slack
        uses: citizensadvice/message-slack-action@080d90bef86e16b0f1d9b07406fad8a9f541fc27
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          channel_id: "C02K26YCER1" #content-platform_builds
          title: ":green-tick: :office::mag: Local Office Search API ${{ inputs.stage }} deployment success"
          message: |
            The Local Office Search API on ${{ inputs.stage }} has been deployed!

  slack-failure:
    name: Slack Notification (Failure)
    runs-on: runs-on
    needs:
      - deploy
    if: failure()
    steps:
      - name: Notify Slack
        uses: citizensadvice/message-slack-action@080d90bef86e16b0f1d9b07406fad8a9f541fc27
        with:
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          channel_id: "C02K26YCER1" #content-platform_builds
          title: ":x: :office::mag: Local Office Search API ${{ inputs.stage }} deployment failure"
          message: |
            The Local Office Search API on ${{ inputs.stage }} failed to deployed :pensive:
